# Enlaces de la portada (site/index.html) al apunte: para cada unidad, las secciones que la respaldan.
#
# Regla: como máximo tres etiquetas; la primera es la sección PRINCIPAL (la que trata el tema de la
# unidad) y las otras, a lo sumo dos secciones de APOYO. Cada etiqueta es un \label{…} de
# apunte/contenido/*.tex (sec:… o cap:…); el enlace es apunte.pdf#nameddest=<etiqueta> (el apunte
# compila hyperref con [destlabel], así que cada \label es un destino con nombre del PDF).
# Las claves son los id de mapa/mapa.yaml (unidades:), en el orden de la portada.
#
# Lo leen tools/build.py (enlaces_portada / validar_enlaces_portada) y tools/test_enlaces_portada.py.

