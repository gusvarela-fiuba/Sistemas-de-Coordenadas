[project]
name = "sistemas-de-coordenadas"
version = "0.1.0"
description = "CB104 Sistemas de Coordenadas (Agrimensura FIUBA): unidades interactivas marimo, mapa de conceptos, apunte LaTeX y entregas"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.24,<0.25",
    "numpy>=2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "pyyaml>=6",
    "markdown>=3.7",
    "pyproj>=3.8.0",
    "ezdxf>=1.4.5",
    "reportlab>=5.0.1",
]

[tool.uv]
package = false

# Demostraciones con código (apunte/demostraciones/): `uv run pytest apunte/demostraciones -q`.
[dependency-groups]
dev = [
    "pytest>=8",
    "sympy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["apunte/demostraciones", "tools/cad"]
python_files = ["cap[0-9][0-9]_*.py", "c[0-9]_*.py", "test_*.py"]
addopts = "--import-mode=importlib"
