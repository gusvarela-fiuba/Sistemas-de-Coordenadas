  nivel: complementario
conceptos:
- id: rotacion
  nombre: Rotación
  clase: "01"
  unidad: 01a_punto_quieto
  hecho_geometrico: Un punto queda quieto y los demás recorren circunferencias concéntricas; x' = c + R(θ)(x − c). Lineal solo si el centro es el origen.
  que_se_conserva: distancias, ángulos y orientación
  apunte: [rotaciones, repaso-algebra]
  requiere: [transformacion-lineal, producto-interno]
- id: numeros-complejos
  nombre: Números complejos como transformaciones del plano
  clase: "01"
  unidad: 00_fundamentos
  unidades: [00_fundamentos, 01b_rotacion_plano]
  hecho_geometrico: Multiplicar por a+ib es rotar y estirar a la vez; es la matriz [[a,−b],[b,a]], dos números libres frente a los cuatro de una 2×2 cualquiera. Los vectores son puntos.
  que_se_conserva: ángulos (y distancias si el módulo es 1)
  apunte: [rotaciones]
  requiere: [rotacion]
- id: formula-de-euler
  nombre: Fórmula de Euler
  clase: "01"
  unidad: 01b_rotacion_plano
  hecho_geometrico: e^{iθ} = cos θ + i sin θ; z·e^{iθ} es z girado θ, y la derivada respecto del ángulo es el mismo punto girado un cuarto de vuelta, el vector tangente a la circunferencia.
  que_se_conserva: el módulo de z
  apunte: [rotaciones]
  requiere: [numeros-complejos]
- id: producto-interno
  nombre: Producto interno
  clase: "01"
  unidad: 02_producto_interno
  hecho_geometrico: ⟨v,u⟩ mide longitudes y ángulos de una vez; conservarlo es que regla y transportador den lo mismo antes y después. No hay base privilegiada salvo por el producto interno.
  que_se_conserva: longitudes y ángulos (es lo que se conserva)
  apunte: [rotaciones]
  requiere: []
- id: matriz-ortogonal
  nombre: Matriz ortogonal
  clase: "01"
  unidad: 01b_rotacion_plano
  hecho_geometrico: AᵀA = Id; columnas perpendiculares de longitud 1; la grilla cuadrada sigue cuadrada pero puede estar espejada. det = +1 rotación, det = −1 reflexión.
  que_se_conserva: producto interno; con det 1, además la orientación
  apunte: [rotaciones, autovectores]
  requiere: [producto-interno, rotacion]
- id: rotacion-3d
  nombre: Rotaciones en tres dimensiones
  clase: "01"
  unidad: 01c_rotaciones_3d
  hecho_geometrico: Rx, Ry, Rz son la rotación 2D empotrada con un 1 en la diagonal para el eje quieto; toda rotación de R³ deja fija una recta (el eje) y gira el plano perpendicular; componer en distinto orden deja el cuerpo en lugares distintos.
  que_se_conserva: distancias, ángulos, orientación y el eje
  apunte: [rotaciones, rot3d]
  requiere: [rotacion, matriz-ortogonal, composicion]
- id: rotacion-infinitesimal
  nombre: Rotación infinitesimal
  clase: "01"
  unidad: 01c_rotaciones_3d
  hecho_geometrico: R(ε) ≈ Id + εA con A antisimétrica; εAv es el pasito tangente a la circunferencia (A_x v = e_x × v). A primer orden las rotaciones chicas se suman y conmutan; el orden aparece en ε².
  que_se_conserva: distancias a primer orden
  apunte: [infinitesimales, rotaciones]
  requiere: [rotacion-3d, derivada-aproximacion-lineal]
- id: exponencial-de-matrices
  nombre: Exponencial de matrices
  clase: "01"
  unidad: null
  hecho_geometrico: e^A = Σ Aⁿ/n!; una rotación grande es muchísimas chiquitas iguales, R = lim (Id + A/n)ⁿ; e^{t log R} es la trayectoria suave de la identidad a R. log R es antisimétrica y sus tres entradas son el eje, con norma igual al ángulo.
  que_se_conserva: el eje (es el autovector de autovalor 1 de R y el vector de log R)
  apunte: [rotaciones, infinitesimales]
  requiere: [rotacion-infinitesimal, trayectoria]
- id: composicion
  nombre: Composición de transformaciones
  clase: "02"
  unidad: 01c_rotaciones_3d
  hecho_geometrico: Hacer F y después G es G∘F, el producto de matrices GF; la de la derecha actúa primero. Es una operación entre transformaciones, con neutro e inversa, que no siempre conmuta.
  que_se_conserva: lo que conservan las dos transformaciones compuestas
  apunte: [traslaciones, composicion-afin]
  requiere: [rotacion, transformacion-lineal]
- id: conmutatividad
  nombre: Conmutatividad
  clase: "02"
  unidad: 01c_rotaciones_3d
  hecho_geometrico: AB = BA es llegar al mismo lugar por los dos caminos del paralelogramo. Rotación y homotecia del mismo centro conmutan; rotaciones 3D no, salvo a primer orden. Sin conmutatividad el par (u,v) no nombra un único punto, así que no hay coordenadas.
  que_se_conserva: el resultado al cambiar el orden
  apunte: [traslaciones, infinitesimales]
  requiere: [composicion, rotacion-3d, rotacion-infinitesimal]
- id: trayectoria
  nombre: Trayectoria de una transformación
  clase: "02"
  unidad: 03_reflexiones_similaridades
  hecho_geometrico: La órbita v, Av, A²v, … (o e^{tM}v en continuo). La transformación se identifica con la trayectoria que genera; rotación → circunferencias, homotecia → rayos, det 1 → se queda dando vueltas.
  que_se_conserva: la curva sobre la que cae el punto
  apunte: [traslaciones, composicion-afin]
  requiere: [composicion, exponencial-de-matrices]
- id: lineas-coordenadas
  nombre: Líneas coordenadas
  clase: "02"
  unidad: 03_reflexiones_similaridades
  hecho_geometrico: Dos familias de transformaciones que conmutan generan una grilla; sus trayectorias son las líneas coordenadas. Cartesianas (dos traslaciones), polares (rotación y homotecia), esfera (paralelos de Rz, meridianos alrededor del eje e_z × p). Los vasos son tres involuciones que conmutan y dan el cubo de 8 estados.
  que_se_conserva: cada coordenada a lo largo de la línea de la otra
  apunte: [derivada, traslaciones]
  requiere: [trayectoria, conmutatividad, producto-vectorial]
- id: homotecia
  nombre: Homotecia
  clase: "02"
  unidad: 03_reflexiones_similaridades
  hecho_geometrico: x' = o + k(x − o), matriz kI con centro en el origen; todo se agranda desde el centro sobre rayos. Conmuta con las rotaciones del mismo centro (es el ρ de ρe^{iθ}) y salta de una circunferencia a otra.
  que_se_conserva: ángulos, paralelismo y razones de distancias
  apunte: [reflexiones, traslaciones]
  requiere: [numeros-complejos, composicion]
- id: reflexion
  nombre: Reflexión (por un punto, por una recta)
  clase: "03"
  unidad: 03_reflexiones_similaridades
  hecho_geometrico: 'El espejo; ρ_b(x) = 2b − x, φ_B(x) = x − 2((n·x − c)/‖n‖²) n, ortogonal con det −1, involución. Dos espejos devuelven la orientación: puntuales o ejes paralelos dan traslación, ejes secantes dan rotación de ángulo doble.'
  que_se_conserva: distancias y ángulos; se invierte la orientación
  apunte: [reflexiones, traslaciones]
  requiere: [matriz-ortogonal, composicion]
- id: afinidad-axial
  nombre: Afinidad axial (eje, dirección y factor)
  clase: "03"
  unidad: 04_afines_homogeneas
  hecho_geometrico: Una recta queda fija y cada punto desliza por su paralela a la dirección, multiplicando por f su distancia al eje; B·diag(1,f)·B⁻¹, det = f. Con f = −1 es la reflexión; tres de ellas llevan cualquier triángulo sobre cualquier otro.
  que_se_conserva: el eje punto a punto, rectas y paralelismo
  apunte: [afines]
  requiere: [reflexion, cambio-de-base]
- id: similaridad
  nombre: Similaridad
  clase: "03"
  unidad: 03_reflexiones_similaridades
  hecho_geometrico: S(x) = o + λR(x − o) = φ_A φ_B η_o^λ; misma forma, otro tamaño y orientación, con un único punto fijo o (dos círculos de Apolonio). Rotar alrededor de c y escalar alrededor de d da una similaridad cuyo punto fijo no es ni c ni d.
  que_se_conserva: ángulos y razones entre distancias
  apunte: [reflexiones, composicion-afin]
  requiere: [reflexion, homotecia, rotacion, punto-fijo]
- id: transformacion-afin
  nombre: Transformación afín
  clase: "03"
  unidad: 04_afines_homogeneas
  hecho_geometrico: F(x) = Ax + t; paralelogramo va a paralelogramo, círculo a elipse, se conservan proporciones sobre cada recta. La imagen de un triángulo la determina del todo (seis números, seis ecuaciones).
  que_se_conserva: rectas, paralelismo y proporciones sobre una recta
  apunte: [afines, rotaciones]
  requiere: [afinidad-axial, traslacion, transformacion-lineal]
- id: coordenadas-homogeneas
  nombre: Coordenadas homogéneas
  clase: "03"
  unidad: 04_afines_homogeneas
  hecho_geometrico: El plano es el plano z = 1 de R³ y cada punto es la recta por el origen que lo atraviesa; (x,y,1) ~ λ(x,y,1). La afinidad es la 3×3 con fila (0 0 1) y la traslación entra en la matriz; tercera coordenada 0 es una dirección, un punto impropio.
  que_se_conserva: la recta por el origen (el rayo), no el representante
  apunte: [afines, composicion-afin]
  requiere: [transformacion-afin, composicion]
- id: punto-fijo
  nombre: Punto fijo
  clase: "03"
  unidad: 03_reflexiones_similaridades
  hecho_geometrico: 'F(x*) = x*, es decir (I − A)x* = t; en homogéneas, autovector de autovalor 1 con w ≠ 0. Es el centro alrededor del cual rotar y trasladar repetidamente dibuja círculos; si existe, poniendo el origen ahí la afinidad queda lineal. Una rotación de R³ tiene autovalor 1: su eje.'
  que_se_conserva: el punto mismo
  apunte: [afines, composicion-afin]
  requiere: [transformacion-afin, coordenadas-homogeneas, autovector]
- id: traslacion
  nombre: Traslación
  clase: "03"
  unidad: 04_afines_homogeneas
  hecho_geometrico: x' = x + v, A = I; todo se desplaza igual y no hay punto fijo propio (el autovector de autovalor 1 tiene w = 0, el punto fijo se fue al infinito). Nace de dos reflexiones y es el límite de rotaciones cuyo centro se aleja. T_v Q_c ≠ Q_c T_v.
  que_se_conserva: distancias, ángulos, orientación y todas las direcciones
  apunte: [afines]
  requiere: [reflexion, punto-fijo, punto-impropio]
- id: mapa-transformaciones
  nombre: Mapa de las transformaciones
  clase: "03"
  unidades: [01b_rotacion_plano, 03_reflexiones_similaridades, 04_afines_homogeneas, 05_proyectivas, 15_transformaciones_conformes]
  hecho_geometrico: 'Cada familia contiene a la anterior y conserva menos: movimientos rígidos (distancias; 2 puntos homólogos), similaridades (ángulos; 2), afinidades (paralelismo; 3 no alineados) y homografías (rectas y razón doble; 4 sin tres alineados).'
  que_se_conserva: 'depende de la familia: ver la tabla'
  apunte: [afines]
  requiere: [traslacion, rotacion, reflexion, similaridad, transformacion-afin, homografia]
- id: plano-proyectivo
  nombre: Plano proyectivo
  clase: "03p"
  unidad: 05_proyectivas
  hecho_geometrico: Cada punto del plano es un rayo por el origen de R3 que corta al plano w=1; la terna (x,y,w) vale a menos de escala.
  que_se_conserva: Rectas e incidencia; nada métrico.
  apunte: [proyectivas]
  requiere: [coordenadas-homogeneas, espacio-vectorial]
- id: punto-impropio
  nombre: Punto impropio (punto en el infinito)
  clase: "03p"
  unidad: 05_proyectivas
  hecho_geometrico: Terna con w=0 es una dirección; es el punto de fuga común a todas las paralelas de esa dirección.
  que_se_conserva: Una afinidad deja fija la recta ideal entera; una proyectiva general manda una recta propia al infinito y puede partir la figura.
  apunte: [proyectivas]
  requiere: [coordenadas-homogeneas, traslacion]
- id: homografia
  nombre: Homografía (transformación proyectiva)
  clase: "03p"
  unidad: 05_proyectivas
  hecho_geometrico: 'p'' ~ H p con H 3x3 invertible y división por W; es la foto de una cámara inclinada: rectas siguen rectas, paralelas convergen. 8 grados de libertad, cuatro puntos sin tres alineados la fijan; H = K2 K1^-1 por el cuadrilátero patrón.'
  que_se_conserva: Rectas, incidencia y razón doble; no paralelismo, ni razones simples, ni ángulos.
  apunte: [proyectivas, pentagono]
  requiere: [transformacion-afin, coordenadas-homogeneas, colinealidad, determinante]
- id: recta-fija
  nombre: Puntos y rectas fijas de una homografía
  clase: "03p"
  unidad: 05_proyectivas
  hecho_geometrico: 'Punto fijo = autovector real de H (siempre hay uno, grado 3); recta fija = autovector de H^T. Raíz doble con cruz de filas nula = recta entera de puntos fijos (eje) más centro: homología; autovalores opuestos = homología armónica (espejo proyectivo, H^2 ~ I).'
  que_se_conserva: El eje punto a punto y el centro; sobre cada recta por el centro, una reflexión vista en perspectiva.
  apunte: [proyectivas, pentagono]
  requiere: [autovector, autovalor, punto-fijo, forma-lineal]
- id: razon-doble
  nombre: Razón doble
  clase: "03p"
  unidad: 05_proyectivas
  hecho_geometrico: (A,B;C,D) de cuatro puntos alineados; en una homología armónica el centro es el conjugado armónico (valor -1) del corte con el eje respecto de los dos puntos intercambiados; el punto medio entre centro y eje se va al infinito.
  que_se_conserva: Es el único número que una homografía conserva sobre una recta.
  apunte: [proyectivas]
  requiere: [homografia, recta-fija]
- id: espacio-vectorial
  nombre: Espacio vectorial
  clase: "04"
  unidad: 00_fundamentos
  unidades: [00_fundamentos, 06_formas_lineales]
  hecho_geometrico: Flechas que se suman por el paralelogramo y se estiran; el cero queda quieto. R es el caso de una sola dirección; los vectores son puntos.
  que_se_conserva: Las dos operaciones (suma y producto por escalar) y su linealidad.
  apunte: [formas-lineales]
  requiere: []
- id: transformacion-lineal
  nombre: Transformación lineal y su matriz
  clase: "04"
  unidad: 06_formas_lineales
  hecho_geometrico: La grilla cuadrada se vuelve una grilla de paralelogramos; cada coordenada de salida es una regla (forma lineal) que mide la entrada, por eso la matriz 'parece formada por ecuaciones de rectas'. Filas = pila de formas, columnas = adónde van e1, e2.
  que_se_conserva: Sumas y escalas; el cero va al cero; la composición es el producto de matrices.
  apunte: [formas-lineales]
  requiere: [espacio-vectorial, composicion]
- id: forma-lineal
  nombre: Forma lineal
  clase: "04"
  unidad: 06_formas_lineales
  hecho_geometrico: Una regla graduada tirada en el plano; sus marcas son rectas paralelas equiespaciadas, perpendiculares al vector (a,b), con separación 1/|(a,b)|. 'No existe el vector fila'; una recta homogénea es una forma y l·p=0 es la incidencia.
  que_se_conserva: La lectura φ(v) cuando vectores y formas se transforman del lado contrario (v con T, φ con T^-1).
  apunte: [formas-lineales]
  requiere: [espacio-vectorial, producto-interno, coordenadas-homogeneas]
- id: dualidad
  nombre: Dualidad vectores–formas
  clase: "04"
  unidad: 06_formas_lineales
  hecho_geometrico: Las formas forman otro espacio vectorial del mismo tamaño; fila por columna es un número; al deformar la figura la regla se deforma con ella y sus coeficientes cambian 'al revés' (A^-1). Sin producto interno forma y vector son objetos distintos; con él, la forma se disfraza de vector. En proyectivas, puntos y rectas se intercambian.
  que_se_conserva: La incidencia punto-recta bajo cualquier transformación; φ(Av) = (φA)(v).
  apunte: [formas-lineales, proyectivas]
  requiere: [forma-lineal, producto-interno, homografia]
- id: curvas-de-nivel
  nombre: Curvas de nivel de una forma lineal
  clase: "04"
  unidad: 06_formas_lineales
  hecho_geometrico: Las rectas φ=c, c entero, son las marcas de la regla; dos formas dan una grilla y un vector se ubica por qué par de marcas lo cruza (la 'séptima con la quinta'). Una matriz diagonal estira las grillas de sus autovectores sin romperlas; el gradiente es una forma cuya marca cero es la tangente.
  que_se_conserva: El número de marca de cada vector al transformar formas con T^-1.
  apunte: [formas-lineales, derivada]
  requiere: [forma-lineal]
- id: subespacio-afin
  nombre: Subespacio afín
  clase: "05"
  unidad: 07a_cuna_determinante
  hecho_geometrico: 'Una recta o un plano cualquiera, no necesariamente por el origen (p + S); tres escrituras de la misma recta: paramétrica, implícita (forma lineal = c) y homogénea (terna l).'
  que_se_conserva: Las afinidades mandan subespacios afines en subespacios afines y conservan paralelismo.
  apunte: [subespacios]
  requiere: [espacio-vectorial, transformacion-afin]
- id: subespacio-lineal
  nombre: Subespacio lineal
  clase: "05"
  unidad: 07b_nucleo_autovectores
  hecho_geometrico: Rectas y planos por el origen; en homogéneas un rayo de R3 es un punto del plano y un plano por el origen es una recta. Los planos elementales e1∧e2, e1∧e3, e2∧e3 son los subespacios coordenados.
  que_se_conserva: Cerrado por suma y escala; contiene al cero.
  apunte: [subespacios]
  requiere: [espacio-vectorial, subespacio-afin]
- id: producto-vectorial
  nombre: Producto vectorial (producto cruz)
  clase: "05"
  unidad: 07a_cuna_determinante
  hecho_geometrico: 'La operación que une dos puntos en su recta (y corta dos rectas en su punto) tiene que ser lineal y dar cero con dos puntos iguales: eso la obliga a ser p×q, ortogonal a ambos, con norma el área del paralelogramo. Solo existe en R3.'
  que_se_conserva: La incidencia (p×q)·p = 0; la antisimetría es la orientación del área.
  apunte: [subespacios]
  requiere: [producto-interno, coordenadas-homogeneas]
- id: producto-cuna
  nombre: Producto cuña (exterior)
  clase: "05"
  unidad: 07a_cuna_determinante
  hecho_geometrico: 'u∧v es un área orientada (bivector), (u∧v)∧w es el volumen det[u v w] e1∧e2∧e3; definido solo por linealidad y antisimetría, funciona en cualquier dimensión (R4: 4 direcciones, 6 planos, 4 volúmenes, 1 hipervolumen). ''Detector de colinealidad'': vale cero cuando los vectores se aplastan.'
  que_se_conserva: Nada; mide cuánto se aplasta. El ortogonal a un subespacio es el que maximiza el volumen.
  apunte: [subespacios]
  requiere: [producto-vectorial, determinante]
- id: determinante
  nombre: Determinante
  clase: "05"
  unidad: 07a_cuna_determinante
  hecho_geometrico: La única operación de n vectores lineal en cada uno y nula si dos coinciden; det[p q r] = (p×q)·r. Volumen orientado del cubo unidad transformado; escalera |a| → área → volumen. Cero si y solo si los vectores son dependientes.
  que_se_conserva: El signo dice si se invierte la orientación; el módulo cuánto se agranda.
  apunte: [subespacios]
  requiere: [producto-vectorial, colinealidad, matriz-ortogonal]
- id: nucleo
  nombre: Núcleo (espacio nulo)
  clase: "05"
  unidad: 07b_nucleo_autovectores
  hecho_geometrico: 'Las direcciones que la transformación aplasta a un punto; visto por filas, el vector donde todas las reglas marcan cero, ortogonal a todas las filas, que entonces caben en un plano: núcleo no trivial ⇔ det = 0. Construir una TL con un vector dado en el núcleo es lo que hace A − λI.'
  que_se_conserva: Nada en esas direcciones; se pierde dimensión y no hay inversa.
  apunte: [subespacios]
  requiere: [determinante, forma-lineal, subespacio-lineal]
- id: colinealidad
  nombre: Colinealidad (tres puntos alineados)
  clase: "05"
  unidad: 07a_cuna_determinante
  hecho_geometrico: r está en la recta pq ⇔ (p×q)·r = 0 ⇔ det de las tres ternas = 0; completamente simétrico en los tres puntos. Es la condición 'sin tres alineados' que necesita la homografía.
  que_se_conserva: Las homografías conservan la colinealidad y nada más.
  apunte: [subespacios, proyectivas]
  requiere: [producto-vectorial, producto-interno, coordenadas-homogeneas]
- id: subespacio-invariante
  nombre: Subespacio invariante
  clase: "06"
  unidad: 07b_nucleo_autovectores
  hecho_geometrico: Una recta por el origen que, al transformar, cae sobre sí misma (quizá estirada o invertida); {0} siempre lo es. En homogéneas, una recta invariante de R3 es un punto fijo del plano y un plano invariante una recta fija. En R3 siempre hay al menos una.
  que_se_conserva: La dirección (la trayectoria más simple que genera la transformación).
  apunte: [autovectores]
  requiere: [subespacio-lineal, transformacion-lineal, punto-fijo]
- id: autovector
  nombre: Autovector
  clase: "06"
  unidad: 07b_nucleo_autovectores
  hecho_geometrico: 'v ≠ 0 con Av = λv; está en el núcleo de A − λI y se calcula como cruz (cuña) de dos filas de A − λI: el vector donde las tres reglas corridas marcan cero. Eje de una rotación; puntos fijos de una proyectiva. Si todos los pares de filas dan cruz nula hay un plano entero (raíz doble).'
  que_se_conserva: La dirección; solo cambia la escala.
  apunte: [autovectores, pentagono, proyectivas]
  requiere: [nucleo, subespacio-invariante, producto-vectorial]
- id: autovalor
  nombre: Autovalor
  clase: "06"
  unidad: 07c_autovalores_3d_puntos_fijos
  unidades: [07c_autovalores_3d_puntos_fijos, 07b_nucleo_autovectores]
  hecho_geometrico: 'Cuánto se estira la dirección fija: 1 queda quieta (eje, punto fijo), −1 se invierte (reflexión), 0 aplasta (núcleo). Complejos conjugados = un giro en un plano, sin vector real. Una rotación de R3 tiene exactamente un autovalor real, 1.'
  que_se_conserva: La escala sobre cada dirección invariante.
  apunte: [autovectores, proyectivas]
  requiere: [autovector, determinante]
- id: polinomio-caracteristico
  nombre: Polinomio característico
  clase: "06"
  unidad: 07c_autovalores_3d_puntos_fijos
  unidades: [07c_autovalores_3d_puntos_fijos, 07b_nucleo_autovectores]
  hecho_geometrico: 'det(A − λI) = 0; es el detector de colinealidad aplicado a las filas corridas de A: para qué λ se vuelven coplanares. Grado impar ⇒ una raíz real; raíces complejas de a pares; raíz doble con cruz nula ⇒ plano de autovectores. Una matriz genérica da raíces feas: el método tiene que correr en planilla o código.'
  que_se_conserva: El conjunto de autovalores no depende de la base (anticipa cambio de base).
  apunte: [autovectores, proyectivas]
  requiere: [determinante, nucleo, autovalor]
- id: svd
  nombre: Descomposición en valores singulares
  clase: "07"
  unidad: 09_cambio_de_base_svd
  hecho_geometrico: 'La circunferencia unidad se vuelve elipse; los ejes de la elipse (salida) y sus preimágenes (entrada) son dos bases ortonormales distintas: A = U Σ Vᵀ es girar, estirar en ejes perpendiculares, girar.'
  que_se_conserva: 'La ortogonalidad de una base bien elegida de la entrada: va a parar a una base ortogonal de la salida. Siempre existe, sin números complejos.'
  apunte: [hilo, svd]
  requiere: [autovector, autovalor, polinomio-caracteristico, matriz-ortogonal, producto-interno, nucleo]
- id: valores-singulares
  nombre: Valores singulares
  clase: "07"
  unidad: 09_cambio_de_base_svd
  hecho_geometrico: Los semiejes de la elipse imagen de la circunferencia unidad; su producto es |det A|; un σ = 0 es una dirección aplastada (núcleo).
  que_se_conserva: El tamaño de los estiramientos principales, independiente de los giros; nunca complejos.
  apunte: [svd]
  requiere: [svd, determinante]
- id: base-privilegiada
  nombre: Base privilegiada
  clase: "07"
  unidad: 09_cambio_de_base_svd
  hecho_geometrico: 'No hay base privilegiada a priori: lo único especial de la canónica es que en ella el producto interno es suma de productos. La SVD construye la base privilegiada de una transformación a partir del producto interno, no de direcciones fijas.'
  que_se_conserva: Longitudes y ángulos medidos con el producto interno; sin distancias todas las grillas valen lo mismo.
  apunte: [svd]
  requiere: [producto-interno, cambio-de-base]
- id: cambio-de-base
  nombre: Cambio de base
  clase: "08"
  unidad: 08_cambio_de_base
  hecho_geometrico: La misma flecha medida con otra grilla; la matriz C tiene en sus columnas la base nueva escrita en la vieja. Al pasar a la base nueva, los vectores van con C⁻¹, las formas lineales con C del otro lado y las transformaciones con C⁻¹ T C (de modo que T = C T_nueva C⁻¹).
  que_se_conserva: 'Todas las relaciones entre los elementos (incidencias L·P = 0, valores de las formas sobre los vectores): ''convertimos todo para que nada cambie''.'
  apunte: [hilo, cambio-base]
  requiere: [transformacion-lineal, forma-lineal, dualidad, coordenadas-homogeneas, inversa]
- id: diagonalizacion
  nombre: Diagonalización
  clase: "08"
  unidad: 08_cambio_de_base
  hecho_geometrico: En la grilla de los autovectores la transformación solo estira cada dirección por su autovalor, de forma independiente; la grilla se estira sin romperse. T = C D C⁻¹ (o sea D = C⁻¹ T C) con C = autovectores en columnas.
  que_se_conserva: 'Las direcciones propias: cada eje de la grilla cae sobre sí mismo.'
  apunte: [cambio-base]
  requiere: [autovector, autovalor, cambio-de-base]
- id: potencias-de-matrices
  nombre: Potencias enteras y reales de una matriz
  clase: "08"
  unidad: 08_cambio_de_base
  hecho_geometrico: 'Tᵗ = C Dᵗ C⁻¹: aplicar n veces es estirar n veces cada eje propio; con t real la transformación es un proceso continuo y el punto recorre una trayectoria.'
  que_se_conserva: 'La base de autovectores: todas las potencias comparten las mismas direcciones propias.'
  apunte: [hilo, cambio-base]
  requiere: [diagonalizacion, trayectoria, exponencial-de-matrices]
- id: derivada-aproximacion-lineal
  nombre: Derivada como aproximación lineal
  clase: "09"
  unidad: 10_jacobiano_primera_forma
  hecho_geometrico: 'Zoom en un punto hasta que la curva parece recta y la superficie parece plana: la derivada es esa recta o ese plano, una transformación lineal que lleva pasitos a pasitos. En R un número, en R²→R una forma lineal, en R²→R³ una jacobiana 3×2.'
  que_se_conserva: A primer orden, longitudes y direcciones de los pasitos (lo chico).
  apunte: [formas-lineales, derivada]
  requiere: [transformacion-lineal, rotacion-infinitesimal]
- id: gradiente
  nombre: Gradiente
  clase: "09"
  unidad: 00_fundamentos
  unidades: [00_fundamentos, 10_jacobiano_primera_forma]
  hecho_geometrico: 'Forma lineal, no vector: una regla de rectas paralelas cuya recta de nivel cero, corrida al punto, es la tangente a la curva de nivel; por eso ''es perpendicular'' a la curva de nivel.'
  que_se_conserva: 'El valor de f a primer orden: ∇f·h mide cuánto sube f al dar el pasito h.'
  apunte: [derivada, formas-lineales]
  requiere: [forma-lineal, curvas-de-nivel, derivada-aproximacion-lineal]
- id: jacobiano
  nombre: Matriz jacobiana
  clase: "09"
  unidad: 10_jacobiano_primera_forma
  hecho_geometrico: 'Matriz m×n cuyas columnas son r_u, r_v: generan el plano tangente (lo recorrible a la salida); su producto cruz es la normal (lo inaccesible). El cuadradito du×dv va a un paralelogramo de lados r_u, r_v.'
  que_se_conserva: 'La estructura lineal local: pasitos en (u,v) ↔ pasitos sobre la superficie.'
  apunte: [formas-lineales, derivada]
  requiere: [derivada-aproximacion-lineal, producto-vectorial, lineas-coordenadas]
- id: hessiana
  nombre: Matriz hessiana
  clase: "09"
  unidad: 10_jacobiano_primera_forma
  hecho_geometrico: 'Forma cuadrática del segundo orden: dice si la gráfica queda arriba del plano tangente (mínimo), abajo (máximo) o lo cruza (silla); sus autovectores son las direcciones principales de curvatura.'
  que_se_conserva: La curvatura de la gráfica en el punto, independiente de la base elegida.
  apunte: [derivada]
  requiere: [derivada-aproximacion-lineal, gradiente, autovector]
- id: funcion-implicita
  nombre: Teorema de la función implícita
  clase: "09"
  unidad: 10_jacobiano_primera_forma
  hecho_geometrico: F(x,y,z) = 0 define z = g(x,y) cerca de un punto si la normal (∇F) 'hace sombra' sobre el eje z, o sea ∂F/∂z ≠ 0; si la normal está acostada en el plano xy la superficie está de canto y no es gráfica ahí. La esfera define z = g(x,y) pero no x = g(y,z) donde la normal es perpendicular al eje x.
  que_se_conserva: Localmente, la superficie como gráfica de una función de dos variables.
  apunte: [derivada]
  requiere: [gradiente, superficie-parametrica]
- id: superficie-parametrica
  nombre: Superficie paramétrica
  clase: "09"
  unidad: 10_jacobiano_primera_forma
  hecho_geometrico: 'r: R²→R³ con los dos espacios separados; la grilla (u,v) se dibuja sobre la superficie como líneas coordenadas. En el polo una coordenada no mueve el punto (r_λ = 0): singularidad, la jacobiana pierde una columna.'
  que_se_conserva: La correspondencia (u,v) ↔ punto de la superficie, salvo en los puntos singulares.
  apunte: [derivada]
  requiere: [lineas-coordenadas, jacobiano]
- id: primera-forma-fundamental
  nombre: Primera forma fundamental
  clase: "09"
  unidad: 10_jacobiano_primera_forma
  hecho_geometrico: 'ds² = E du² + 2F du dv + G dv² con E = r_u·r_u, F = r_u·r_v, G = r_v·r_v: la regla local para medir el pasito usando solo (du,dv); g = JᵀJ y bajo cambio de coordenadas g'' = Jᵀ g J. En la esfera G = R² cos²φ: un grado de longitud vale 111 km en el ecuador y 55 km a 60°.'
  que_se_conserva: Longitudes y ángulos sobre la superficie, medidos desde las coordenadas.
  apunte: [derivada]
  requiere: [jacobiano, producto-interno, superficie-parametrica, cambio-de-base]
- id: inversa
  nombre: Inversa (respecto de una operación)
  clase: "10"
  unidad: 09_cambio_de_base_svd
  hecho_geometrico: 'Deshacer el movimiento: 1/a en R, A⁻¹ en Rⁿ; en base de autovectores es tomar recíprocos en la diagonal, en SVD es V (1/Σ) Uᵀ. No existe si alguna dirección se aplastó (a = 0, det A = 0, algún σ = 0).'
  que_se_conserva: 'El neutro de la operación: componer con la inversa da la identidad (0 para la suma, 1 para el producto, Id para las matrices).'
  apunte: [hilo, inversas]
  requiere: [composicion, determinante, nucleo, diagonalizacion, svd, matriz-ortogonal]
- id: cuatro-subespacios
  nombre: Los cuatro subespacios (núcleo, co-imagen, imagen, contra-imagen)
  clase: "10"
  unidad: 09_cambio_de_base_svd
  hecho_geometrico: 'Núcleo: lo que entra y cae al 0; co-imagen (contra-núcleo): lo que entra y no cae; imagen: lo alcanzable a la salida; contra-imagen (espacio inaccesible): lo perpendicular a la imagen. Restringida de co-imagen a imagen la transformación sí se invierte. En SVD los v_i y u_i con σ_i > 0 generan co-imagen e imagen.'
  que_se_conserva: 'La dimensión: dim co-imagen = dim imagen = rango; para la jacobiana 3×2, imagen = plano tangente y contra-imagen = normal.'
  apunte: [inversas]
  requiere: [nucleo, subespacio-lineal, svd, jacobiano]
- id: pseudoinversa
  nombre: Pseudoinversa de Moore-Penrose
  clase: "10"
  unidad: 09_cambio_de_base_svd
  hecho_geometrico: 'Proyectar el término independiente sobre la imagen (descartar lo que cae en la contra-imagen) y deshacer solo la parte invertible: A⁺ = V Σ⁺ Uᵀ con recíprocos de los σ ≠ 0 y ceros donde había ceros; en R, la pseudoinversa de 0 es 0.'
  que_se_conserva: La solución exacta cuando existe; si no, la más cercana, con el residuo perpendicular a la imagen.
  apunte: [hilo, inversas]
  requiere: [inversa, cuatro-subespacios, svd, producto-interno]
- id: sistema-sobredeterminado
  nombre: Sistema sobredeterminado y mínimos cuadrados
  clase: "10"
  unidad: 09_cambio_de_base_svd
  hecho_geometrico: 'Más ecuaciones que incógnitas: b no está en la imagen. Tres puntos no alineados no admiten recta; las ecuaciones normales AᵀA x = Aᵀb eligen la recta cuyo vector de residuos es perpendicular a las columnas de A. Ejemplo: (0,0),(1,1),(2,3) → y = −1/6 + 3x/2.'
  que_se_conserva: 'La perpendicularidad del residuo a la imagen: lo que se alcanza es la proyección de b.'
  apunte: [inversas]
  requiere: [pseudoinversa, producto-interno, transformacion-afin]
- id: regresion-simple
  nombre: Regresión simple
  clase: "11"
  unidad: 11_cuatro_problemas
  hecho_geometrico: 'La recta y = ax + b que deja a y lo más cerca posible del plano generado por las columnas de A: proyección ortogonal de y sobre la imagen; se minimiza la distancia vertical en cada x_i.'
  que_se_conserva: El residuo queda ortogonal a la imagen de A (ecuaciones normales).
  apunte: [cuatro-problemas]
  requiere: [pseudoinversa, sistema-sobredeterminado, cuatro-subespacios, producto-interno]
- id: interseccion-de-circulos
  nombre: Intersección de círculos
  clase: "11"
  unidad: 11_cuatro_problemas
  hecho_geometrico: Restar dos ecuaciones de círculos cancela los cuadráticos y deja la recta por sus puntos de corte (eje radical); con tres o más círculos queda un sistema lineal sobredeterminado.
  que_se_conserva: El punto buscado está en todos los ejes radicales; la linealización no cambia la solución, cambia la forma de las ecuaciones.
  apunte: [cuatro-problemas]
  requiere: [pseudoinversa, sistema-sobredeterminado, nucleo]
- id: procrustes
  nombre: Procrustes
  clase: "11"
  unidad: 11_cuatro_problemas
  hecho_geometrico: 'Superponer dos nubes de puntos con la rotación (y escala) que mejor las ajusta: la SVD de la matriz de correlación H = PᵀQ separa el giro (U, V) del estiramiento (Σ). Helmert 2D en Topografía.'
  que_se_conserva: 'Distancias y ángulos dentro de cada nube: solo se permite rotar, trasladar y escalar.'
  apunte: [cuatro-problemas]
  requiere: [svd, valores-singulares, producto-interno, matriz-ortogonal]
- id: regresion-total
  nombre: Regresión total
  clase: "11"
  unidad: 11_cuatro_problemas
  hecho_geometrico: La recta que minimiza las distancias perpendiculares es el eje mayor de la elipse de dispersión de la nube; la normal es la dirección de menor varianza, el vector singular del menor valor singular.
  que_se_conserva: La dirección que menos cambia bajo XᵀX; el residuo total es σ_min².
  apunte: [cuatro-problemas]
  requiere: [svd, valores-singulares, diagonalizacion, forma-cuadratica]
- id: curvatura
  nombre: Curvatura
  clase: "12"
  unidad: 12_curvatura
  hecho_geometrico: Tasa de cambio del ángulo de la tangente por unidad de avance; 1/R del círculo osculador; en un gráfico con tangente horizontal es la segunda derivada.
  que_se_conserva: La curvatura de una curva no depende de cómo se la recorra (parametrización); la de Gauss no cambia al doblar la superficie sin estirarla.
  apunte: [curvatura]
  requiere: [derivada-aproximacion-lineal, hessiana]
- id: forma-cuadratica
  nombre: Forma cuadrática
  clase: "12"
  unidad: 12_curvatura
  hecho_geometrico: Un número que sale de un vector pasando por una matriz simétrica, vᵀHv; la curvatura normal en dirección α es la hessiana evaluada en (cos α, sin α); diagonalizar es rotar los ejes hasta que desaparece el término cruzado y aparecen las direcciones principales, ortogonales.
  que_se_conserva: 'Los autovalores (curvaturas principales) y el determinante: la forma no cambia de valor al rotar los ejes, solo de escritura.'
  apunte: [curvatura]
  requiere: [hessiana, autovector, diagonalizacion, svd, producto-interno]
- id: geodesica
  nombre: Geodésica
  clase: "12"
  unidad: 12_curvatura
  hecho_geometrico: 'La curva más recta posible sobre una superficie: no se tuerce dentro de ella (aceleración normal a la superficie); la más corta entre puntos cercanos. Círculos máximos en la esfera; meridianos sí y paralelos no en el elipsoide.'
  que_se_conserva: La dirección tangente se transporta sin girar dentro del plano tangente (curvatura geodésica cero).
  apunte: [curvatura]
  requiere: [curvatura, primera-forma-fundamental, superficie-parametrica]
- id: elipsoide
  nombre: Elipsoide de revolución
  clase: "13"
  unidad: 13_elipsoide
  hecho_geometrico: La elipse meridiana girada alrededor de su eje menor; la normal no pasa por el centro (latitud geodésica ≠ geocéntrica); radios de curvatura M (meridiano) y N (primer vertical), ambos crecen del ecuador al polo y coinciden en el polo.
  que_se_conserva: La forma de la elipse meridiana en todo meridiano; nada métrico depende de λ.
  apunte: [elipsoide]
  requiere: [superficie-parametrica, primera-forma-fundamental, curvatura, forma-cuadratica, rotacion-3d]
- id: simetria
  nombre: Simetría (deducciones a partir de)
  clase: "13"
  unidad: 13_elipsoide
  hecho_geometrico: 'El plano meridiano es plano de simetría: la forma cuadrática de la curvatura es simétrica respecto del meridiano, así que las direcciones principales tienen que ser meridiano y primer vertical sin calcular; la revolución hace que M, N y K sean funciones de φ sola.'
  que_se_conserva: El elipsoide cae sobre sí mismo al rotar alrededor del eje polar y al reflejar en cualquier plano meridiano.
  apunte: [elipsoide]
  requiere: [reflexion, rotacion-3d, curvatura, forma-cuadratica]
- id: trigonometria-esferica
  nombre: Trigonometría esférica
  clase: "14"
  unidad: 14_trigonometria_esferica
  hecho_geometrico: 'Un triángulo esférico son tres planos por el centro: los lados son ángulos entre radios (producto interno), los ángulos son diedros entre planos (producto vectorial); ley de cosenos cos a = cos b cos c + sin b sin c cos A; exceso esférico = área/R².'
  que_se_conserva: Lados, ángulos y área bajo rotaciones de la esfera; para lados chicos se recupera la trigonometría plana.
  apunte: [esfera]
  requiere: [producto-interno, producto-vectorial, geodesica, rotacion-3d]
- id: poligono-geodesico
  nombre: Polígono geodésico
  clase: "14"
  unidad: 14_trigonometria_esferica
  hecho_geometrico: 'Poligonal cerrada de lados geodésicos: la suma de ángulos excede (n−2)π en área/R²; el error de cierre de una poligonal sobre la Tierra delata que no es plana. Sobre el elipsoide no hay fórmula cerrada: series o CAS (Maxima).'
  que_se_conserva: 'El exceso esférico es área, no error: se separa antes de compensar la poligonal.'
  apunte: [esfera]
  requiere: [trigonometria-esferica, geodesica, elipsoide]
- id: transformacion-conforme
  nombre: Transformación conforme
  clase: "13"
  unidad: 15_transformaciones_conformes
  hecho_geometrico: 'Con lupa infinitesimal es una similaridad directa: el Jacobiano es k(P)·R(θ), de la forma [[a, −b], [b, a]] del número complejo; σ₁ = σ₂, F = 0 y E = G = k², Cauchy-Riemann. Sobre el elipsoide (K > 0) no hay isometría al plano: lo que se negocia es la escala, nunca el ángulo.'
  que_se_conserva: Los ángulos entre curvas (y la forma de las figuras chicas); la escala k(P) cambia de punto a punto.
  apunte: [conformes]
  requiere: [jacobiano, similaridad, svd, primera-forma-fundamental, numeros-complejos, elipsoide]
- id: indicatriz-de-tissot
  nombre: Indicatriz de Tissot
  clase: "13"
  unidad: 15_transformaciones_conformes
  hecho_geometrico: 'La imagen de un círculo infinitesimal del terreno por el Jacobiano de la proyección: una elipse de semiejes σ₁ ≥ σ₂ (SVD); es un círculo si y solo si la proyección es conforme. Deformación angular máxima ω = 2 arcsin((σ₁ − σ₂)/(σ₁ + σ₂)); área σ₁σ₂ = det J.'
  que_se_conserva: 'Lo que dice la elipse: forma (conforme) si σ₁ = σ₂, área (equivalente) si σ₁σ₂ = 1, el meridiano (equidistante) si h = 1.'
  apunte: [conformes]
  requiere: [jacobiano, svd, valores-singulares, primera-forma-fundamental]
- id: latitud-isometrica
  nombre: Latitud isométrica
  clase: "13"
  unidad: 15_transformaciones_conformes
  hecho_geometrico: 'q(φ) = ln tan(π/4 + φ/2) − (e/2) ln[(1 + e sin φ)/(1 − e sin φ)]: la coordenada norte que estira el meridiano hasta que dq = M dφ/(N cos φ) mide lo mismo que dλ; con ella ds² = N² cos²φ (dq² + dλ²) y la grilla (λ, q) tiene cuadraditos de verdad.'
  que_se_conserva: 'La igualdad de escalas en las dos direcciones de la grilla: E = G, F = 0; q → ∞ en los polos.'
  apunte: [conformes]
  requiere: [elipsoide, primera-forma-fundamental, transformacion-conforme]
- id: mercator
  nombre: Proyección de Mercator
  clase: "13"
  unidad: 15_transformaciones_conformes
  hecho_geometrico: 'x = a λ, y = a q(φ): la cilíndrica conforme; h = k = a/(N cos φ) crece hacia los polos, los círculos de Tissot siguen círculos y las loxodromias son rectas. La cilíndrica equidistante (y = S(φ), h = 1) y la equivalente (h·k = 1) son las otras dos respuestas a las preguntas del apunte del elipsoide.'
  que_se_conserva: Los ángulos (rumbos); ni las distancias ni las áreas, que se inflan como 1/(N² cos²φ).
  apunte: [conformes]
  requiere: [latitud-isometrica, transformacion-conforme, indicatriz-de-tissot]
- id: gauss-kruger
  nombre: Gauss-Krüger (Mercator transversa)
  clase: "13"
  unidad: 15_transformaciones_conformes
  hecho_geometrico: 'La conforme que usa la Argentina (POSGAR, fajas): w = f(q + i Δλ) con f analítica (Cauchy-Riemann ⇒ conforme) y elegida para que sobre el meridiano central (Δλ = 0) la ordenada sea el arco de meridiano S(φ); el cilindro es tangente a un meridiano en vez del ecuador y la escala k crece con Δλ².'
  que_se_conserva: Los ángulos; la escala 1 solo sobre el meridiano central (k₀ = 1 en Gauss-Krüger argentino).
  apunte: [conformes]
  requiere: [transformacion-conforme, latitud-isometrica, mercator, numeros-complejos]
unidades:
- id: 00_fundamentos
  archivo: unidades/00_fundamentos.py
  titulo: 'El idioma de la materia: puntos, flechas, reglas y distancias'
  estado: piloto
  clases:
  - "01"
  - "04"
  - "09"
  pregunta: ¿Por qué un vector es un punto, el gradiente no es un vector y el álgebra lineal es la mitad del análisis sobre el terreno?
  gancho_agrimensura: Un mojón es un punto, las curvas de nivel son una forma lineal y pasar de grados (φ, λ) a metros en el campo es derivar la grilla.
  nivel: troncal
- id: 01a_punto_quieto
  archivo: unidades/01a_punto_quieto.py
  titulo: 'Rotaciones I: el punto no se movió'
  estado: piloto
  clases:
  - "01"
  pregunta: Si giro los ejes 30°, ¿se mueve el mojón o se mueven sus coordenadas?
  gancho_agrimensura: El instrumento mide en sus propios ejes; pasar las lecturas al norte de la parcela es una rotación.
  nivel: troncal
- id: 01b_rotacion_plano
  archivo: unidades/01b_rotacion_plano.py
  titulo: 'Rotaciones II: la rotación en el plano'
  estado: piloto
  clases:
  - "01"
  pregunta: ¿Qué le pasa a la parcela cuando la giro, y qué no le pasa? ¿Por qué un espejo no es un giro?
  gancho_agrimensura: 'Girar el plano entero para poner el norte arriba: cada distancia, cada ángulo y el área del título tienen que quedar iguales.'
  nivel: troncal
- id: 01c_rotaciones_3d
  archivo: unidades/01c_rotaciones_3d.py
  titulo: 'Rotaciones III: tres ejes y el orden importa'
  estado: piloto
  clases:
  - "01"
  - "02"
  pregunta: ¿Por qué en 3D importa el orden en que giro, y por qué igual el resultado es un solo giro alrededor de un eje?
  gancho_agrimensura: 'Nivelar el instrumento: inclinar y después girar no lo deja igual que girar y después inclinar, salvo con correcciones chicas.'
  nivel: troncal
- id: 02_producto_interno
  archivo: unidades/02_producto_interno.py
  titulo: 'Producto interno: proyección, longitud, ángulo'
  estado: piloto
  clases:
  - "01"
  pregunta: ¿Qué cuenta con dos columnas de coordenadas me da la distancia entre dos mojones, el ángulo entre dos lados y cuánto de un lado cae sobre el otro?
  gancho_agrimensura: Con las coordenadas de tres mojones calculo el ángulo en el vértice sin medirlo, y proyecto un lado sobre el rumbo de la línea de base.
  nivel: troncal
- id: 03_reflexiones_similaridades
  archivo: unidades/03_reflexiones_similaridades.py
  titulo: Reflexiones y similaridades
  estado: piloto
  clases:
  - "02"
  - "03"
  pregunta: ¿Qué movimiento conserva la forma pero no el tamaño, y cuál da vuelta la orientación?
  gancho_agrimensura: Un plano viejo en otra escala y con el norte para otro lado hay que superponerlo sobre el relevamiento nuevo.
  nivel: troncal
- id: 04_afines_homogeneas
  archivo: unidades/04_afines_homogeneas.py
  titulo: Afinidades y coordenadas homogéneas
  estado: piloto
  clases:
  - "03"
  pregunta: ¿Cómo meto la traslación adentro de la matriz para componer rotar, escalar y mover con una sola cuenta?
  gancho_agrimensura: 'Un plano escaneado que quedó estirado distinto en cada eje: las paralelas siguen paralelas y tres puntos conocidos alcanzan para corregirlo.'
  nivel: troncal
- id: 05_proyectivas
  archivo: unidades/05_proyectivas.py
  titulo: 'Proyectivas: la foto del dron y el pentágono'
  estado: piloto
  clases:
  - "03p"
  pregunta: ¿Por qué en la foto los alambrados paralelos se juntan en un punto, y con cuántos puntos enderezo la imagen?
  gancho_agrimensura: 'Foto de dron inclinada sobre un lote plano: cuatro mojones de coordenadas conocidas la rectifican, y el mojón del centro cae donde se cruzan las diagonales.'
  nivel: complementario
- id: 06_formas_lineales
  archivo: unidades/06_formas_lineales.py
  titulo: Formas lineales y dualidad
  estado: piloto
  clases:
  - "04"
  pregunta: ¿Qué es una regla graduada tirada en el plano, y por qué una recta se transforma al revés que un punto?
  gancho_agrimensura: 'Las curvas de nivel de un plano acotado son las marcas de una regla: cerca de cada punto, la cota es una forma lineal.'
  nivel: troncal
- id: 07a_cuna_determinante
  archivo: unidades/07a_cuna_determinante.py
  titulo: 'Cuña y determinante: el detector de colinealidad'
  estado: piloto
  clases:
  - "05"
  pregunta: ¿Cómo detecto con una cuenta que tres mojones están alineados, y cuánto agranda el área (o el volumen) una transformación?
  gancho_agrimensura: 'Tres mojones que deberían estar alineados: el determinante de sus coordenadas homogéneas los delata, y hasta dice cuánto se salió el tercero.'
  nivel: troncal
- id: 07b_nucleo_autovectores
  archivo: unidades/07b_nucleo_autovectores.py
  titulo: 'Núcleo y autovectores: las direcciones que no giran'
  estado: piloto
  clases:
  - "05"
  - "06"
  pregunta: ¿Qué direcciones caen sobre sí mismas al transformar, y cómo las encuentro con una cuenta?
  gancho_agrimensura: 'Un plano deformado por el escáner: casi todos los rumbos giran, pero dos salen con el mismo rumbo que entraron.'
  nivel: troncal
- id: 07c_autovalores_3d_puntos_fijos
  archivo: unidades/07c_autovalores_3d_puntos_fijos.py
  titulo: Autovalores en 3D y puntos fijos proyectivos
  estado: piloto
  clases:
  - "06"
  pregunta: ¿Qué recta del espacio deja quieta una rotación compuesta, y qué tiene que ver con los puntos fijos de una foto rectificada?
  gancho_agrimensura: El eje de una rotación es la dirección que no gira; en la foto rectificada, un punto fijo es un autovector de la 3×3.
  nivel: complementario
- id: 08_cambio_de_base
  archivo: unidades/08_cambio_de_base.py
  titulo: Cambio de base y diagonalización
  estado: piloto
  clases:
  - "08"
  pregunta: Si la flecha no se movió pero cambié la grilla, ¿cómo cambian los números, y en qué grilla una transformación es solo estirar?
  gancho_agrimensura: 'El mismo mojón con coordenadas en tres marcos: cambia la grilla con que se mide, no el punto.'
  nivel: troncal
- id: 09_cambio_de_base_svd
  archivo: unidades/09_cambio_de_base_svd.py
  titulo: Cambio de base, SVD e inversas
  estado: piloto
  clases:
  - "07"
  - "10"
  pregunta: ¿Qué direcciones perpendiculares siguen perpendiculares después de transformar, y qué es lo más parecido a deshacer cuando no hay inversa?
  gancho_agrimensura: 'Más mediciones que incógnitas (una recta por puntos que no están alineados): la pseudoinversa elige la que deja el residuo perpendicular.'
  nivel: avanzado
- id: 10_jacobiano_primera_forma
  archivo: unidades/10_jacobiano_primera_forma.py
  titulo: Jacobiano y primera forma fundamental
  estado: piloto
  clases:
  - "09"
  pregunta: ¿Cómo mido una distancia chica sobre una superficie curva usando solo los números (u, v) de la grilla?
  gancho_agrimensura: 'Sobre el terreno, un pasito en latitud y otro en longitud no miden lo mismo en metros: la primera forma fundamental es la regla que los convierte.'
  nivel: troncal
- id: 11_cuatro_problemas
  archivo: unidades/11_cuatro_problemas.py
  titulo: 'Cuatro problemas: regresión, círculos, Procrustes, regresión total'
  estado: piloto
  clases:
  - "11"
  pregunta: ¿Qué tienen en común ajustar una recta, ubicar un punto por distancias, superponer dos relevamientos y ajustar una recta con error en las dos coordenadas?
  gancho_agrimensura: 'Compensar un relevamiento con más mediciones que incógnitas: la misma cuenta resuelve la recta de ajuste y la transformación entre dos sistemas de mojones.'
  nivel: avanzado
- id: 12_curvatura
  archivo: unidades/12_curvatura.py
  titulo: Curvatura como forma cuadrática
  estado: piloto
  clases:
  - "12"
  pregunta: ¿Cuánto se aparta la superficie de su plano tangente en cada rumbo, y qué quiere decir ir derecho sobre ella?
  gancho_agrimensura: 'Un instrumento que marca la vertical, apoyado en el terreno: la curvatura dice cuánto cambia esa vertical al dar un paso en cada rumbo.'
  nivel: troncal
- id: 13_elipsoide
  archivo: unidades/13_elipsoide.py
  titulo: Geometría del elipsoide
  estado: piloto
  clases:
  - "13"
  pregunta: ¿Qué se deduce del elipsoide con solo saber que todos sus meridianos son la misma elipse?
  gancho_agrimensura: La latitud geodésica y la geocéntrica no coinciden porque la normal al elipsoide no pasa por el centro; eso cambia las coordenadas de todo mojón.
  nivel: troncal
- id: 14_trigonometria_esferica
  archivo: unidades/14_trigonometria_esferica.py
  titulo: Trigonometría esférica
  estado: piloto
  clases:
  - "14"
  pregunta: ¿Cómo se relacionan lados y ángulos de un triángulo trazado sobre la esfera, y por qué sus ángulos suman más de 180°?
  gancho_agrimensura: Entre tres vértices lejanos la suma de ángulos de la poligonal trae un exceso esférico; corregirlo es parte del cálculo.
  nivel: complementario
- id: 15_transformaciones_conformes
  archivo: unidades/15_transformaciones_conformes.py
  titulo: 'Transformaciones conformes: números complejos, Jacobiano y del elipsoide al plano cartográfico'
  estado: piloto
  clases:
  - "13"
  - "14"
  pregunta: ¿Qué tiene que cumplir una transformación para conservar los ángulos, y cómo se lleva el elipsoide al plano sin torcer una sola visual?
  gancho_agrimensura: 'Dos visuales a 90° medidas con el instrumento siguen a 90° en la hoja solo si la proyección es conforme: Mercator, Gauss-Krüger, POSGAR.'
  nivel: complementario
