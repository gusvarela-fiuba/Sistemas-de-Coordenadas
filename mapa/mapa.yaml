  nivel: troncal
- id: "09"
  titulo: Derivada, gradiente y jacobiano
  ficha: clases/09-analisis-derivada-jacobiano.md
  pregunta: ¿Qué transformación lineal aproxima una función cerca de un punto, y qué mide el gradiente?
  nivel: troncal
- id: "10"
  titulo: Inversas, cuatro subespacios y pseudoinversa
  ficha: clases/10-inversas-pseudoinversa.md
