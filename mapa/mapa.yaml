  nivel: troncal
- id: "03"
  titulo: Reflexiones, similaridades y afinidades
  ficha: clases/03-afines.md
  pregunta: ¿Qué movimientos del plano conservan rectas las rectas y paralelas las paralelas, y cómo meto la traslación en la matriz?
  nivel: troncal
- id: "03p"
  titulo: Transformaciones proyectivas
  ficha: clases/03p-proyectivas.md
  pregunta: ¿Por qué en la foto las paralelas se cortan, y qué queda fijo cuando una cámara inclinada mira un lote plano?
  nivel: complementario
- id: "04"
  titulo: Formas lineales y dualidad
  ficha: clases/04-espacios-lineales-formas.md
  pregunta: ¿Qué es un vector, qué es una regla que mide vectores, y por qué cada uno se transforma distinto?
  nivel: troncal
- id: "05"
  titulo: Subespacios, producto cuña y determinante
  ficha: clases/05-subespacios-cuna-determinante.md
  pregunta: ¿Cómo detecto con una cuenta que unos vectores (o unos puntos) se aplastaron a algo de menor dimensión?
  nivel: troncal
- id: "06"
  titulo: Autovalores y autovectores
  ficha: clases/06-invariantes-autovectores.md
  pregunta: ¿Qué direcciones caen sobre sí mismas al transformar, y cómo las encuentro?
  nivel: troncal
- id: "07"
  titulo: La SVD, de la circunferencia a la elipse
  ficha: clases/07-svd.md
  pregunta: Cuando no hay direcciones fijas reales, ¿qué par de bases perpendiculares vuelve diagonal a la transformación?
  nivel: avanzado
- id: "08"
  titulo: Cambio de base y diagonalización
  ficha: clases/08-cambio-de-base.md
