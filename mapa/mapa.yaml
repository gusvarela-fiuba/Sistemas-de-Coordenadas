  nivel: avanzado
- id: "11"
  titulo: Cuatro problemas de ajuste
  ficha: clases/11-cuatro-problemas.md
  pregunta: ¿Cómo se resuelven con pseudoinversa y SVD una recta de ajuste, un punto por distancias y la superposición de dos nubes?
  nivel: avanzado
- id: "12"
  titulo: Curvatura y formas cuadráticas
  ficha: clases/12-curvatura.md
