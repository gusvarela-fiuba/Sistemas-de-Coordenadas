# Sitio de Sistemas de Coordenadas (CB104) en GitHub Pages.
#
# En cada push a main (y a mano con workflow_dispatch): build del sitio y despliegue.
# En pull requests: solo el job de build, como CI (sin subir artefacto ni desplegar).
#
# Una vez por repo, en GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Red en el runner: `marimo export html-wasm` NO descarga nada en el build; copia el frontend desde el
# wheel de marimo (`marimo/_static/`), y solo en modo desarrollo de marimo (MARIMO_DEVELOPMENT_MODE)
# lo pediría a jsdelivr. Pyodide y los paquetes (numpy, plotly) los baja el navegador de quien abre la lección desde el
# CDN al abrir cada lección, no el runner. La primera exportación después de `uv sync` tarda ~40 s
# (compila bytecode); las siguientes 1–2 s por lección.
#
# Tamaño: cada lección exportada lleva los assets completos de marimo (~27 MB); con 20 lecciones el sitio
# ronda 540 MB. El límite de un sitio publicado en GitHub Pages es 1 GB (ver tools/README.md, "Tamaño
# del sitio", para la mejora de compartir un único assets/).

name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2              # el padre, para comparar apunte/paginas_esperadas.txt

      - name: uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true          # cachea ~/.cache/uv con clave sobre uv.lock
          python-version: "3.14"      # mismo intérprete que el venv local; el lock es universal (>=3.12)

      - name: Dependencias (uv.lock congelado)
        run: uv sync --frozen

      - name: Mapa de conceptos (merge de los fragmentos)
        run: uv run tools/merge_mapa.py

      - name: El mapa.yaml commiteado tiene que coincidir con los fragmentos
        run: git diff --exit-code mapa/mapa.yaml

      - name: marimo check de las lecciones
        run: uv run marimo check --select MW unidades/[01]*.py

      # Hoja de estilo (apunte/ESTILO.md): la fase F cerró y el control es bloqueante;
      # un hallazgo de estilo frena la publicación.
      - name: Estilo (hoja de estilo apunte/ESTILO.md; si hay hallazgos, no se publica)
        run: uv run python apunte/scripts/estilo.py --estricto

      # La misma hoja de estilo sobre lo interactivo: la prosa de unidades/ (mo.md, títulos, banco), clases/,
      # mapa/, moodle/ y los .md de la raíz (tildes de «solo», comillas rectas, decimales, «es decir», «Desarrollo.»,
      # instrumentos, «desaprender», voseo). También bloqueante.
      - name: Estilo de lo interactivo (unidades, fichas, mapa, Moodle y .md de la raíz; si hay hallazgos, no se publica)
        run: |
          uv run python apunte/scripts/estilo.py --alcance interactivo --estricto
          uv run pytest -q apunte/scripts/test_estilo_interactivo.py

      - name: Demostraciones (comprobaciones con código de apunte/demostraciones; si fallan, no se publica)
        run: uv run pytest apunte/demostraciones tools/cad -q

      - name: Los fragmentos commiteados (apunte/generado) tienen que coincidir con las pruebas
        run: |
          uv run python apunte/scripts/extraer_fragmentos.py
          git status --porcelain apunte/generado
          test -z "$(git status --porcelain apunte/generado)"

      - name: poppler-utils (pdftotext, pdfinfo para el menú) y fuente DejaVu para menu.pdf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils fonts-dejavu-core

      # El PDF no se compila en el runner: se publica el commiteado. Tiene que estar entero y
      # coincidir con apunte/paginas_esperadas.txt (mismo commit); ver scripts/README.md.
      - name: Verificar el PDF commiteado
        run: |
          scripts/verificar_pdf.sh apunte/Apunte_Sistemas_de_Coordenadas.pdf
          # Menos páginas que en el commit padre: solo con «PAGINAS-BAJAN: motivo» en el mensaje.
          # Si el padre no existe o no tiene el archivo (primera vez), el control no aplica.
          git show HEAD~1:apunte/paginas_esperadas.txt > "$RUNNER_TEMP/paginas_padre.txt" 2>/dev/null || : > "$RUNNER_TEMP/paginas_padre.txt"
          git log -1 --format=%B > "$RUNNER_TEMP/mensaje.txt"
          scripts/paginas_no_bajan.sh apunte/Apunte_Sistemas_de_Coordenadas.pdf "$RUNNER_TEMP/paginas_padre.txt" "$RUNNER_TEMP/mensaje.txt"

      - name: Sitio (portada, mapa, fichas, menú, apunte.pdf y export WASM de las lecciones)
        run: uv run python tools/build.py

      - name: Limpiar intermedios del build
        run: rm -rf site/_build

      - name: Búsqueda de términos sobre el artefacto
        run: uv run python apunte/scripts/prohibidas.py --dir site

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # para desplegar a Pages
      id-token: write   # deploy-pages verifica la fuente del deploy con el token OIDC; necesita write, no read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
